name: Build Godot APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Export Godot Game (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 platform-tools'

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Start ADB Server
        run: |
          adb start-server || true
          adb devices || true

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Godot Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d temp_templates
          find temp_templates -type f \( -name "android_debug.apk" -o -name "android_release.apk" -o -name "*.tres" \) -exec cp {} ~/.local/share/godot/export_templates/4.3.stable/ \;

      - name: Create Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          echo '[resource]' > ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "$ANDROID_SDK_ROOT"' >> ~/.config/godot/editor_settings-4.tres

      - name: Export Debug APK
        run: |
          mkdir -p build/android
          
          # Ensure ADB is running inside the export step as well
          adb start-server || true
          
          # Run godot once to initialize settings, then export
          godot --path . --headless --editor --quit || true
          
          # Now export the debug apk
          godot --path . --verbose --headless --export-debug "Android" build/android/raiden-game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raiden-game-apk
          path: build/android/raiden-game.apk
